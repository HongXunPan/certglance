name: SSL 小组件文件共享签名 PoC

on:
  workflow_dispatch:
    inputs:
      diagnostic_without_helper:
        description: '诊断包：不嵌入修复助手，仅验证 Finder 覆盖后的原组件位置'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ssl-widget-sharing-poc
  cancel-in-progress: false

jobs:
  package-poc:
    name: 构建并签名独立假数据组件
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - name: 检出开源子仓
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
        with:
          persist-credentials: false

      - name: 确认手动运行分支
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '只允许从 main 分支打包签名 PoC。' >&2
            exit 1
          fi

      - name: 校验 PoC 结构与脚本
        run: |
          bash -n scripts/check-widget-sharing-poc.sh scripts/package-widget-sharing-poc.sh
          bash scripts/check-widget-sharing-poc.sh

      - name: 使用 SSL Widget 专用证书打包
        env:
          SSL_WIDGET_SIGNING_P12_BASE64: ${{ secrets.SSL_WIDGET_SIGNING_P12_BASE64 }}
          SSL_WIDGET_SIGNING_P12_PASSWORD: ${{ secrets.SSL_WIDGET_SIGNING_P12_PASSWORD }}
          SSL_WIDGET_SIGNING_CERT_SHA1: ${{ vars.SSL_WIDGET_SIGNING_CERT_SHA1 }}
          WIDGET_SHARING_DIAGNOSTIC_WITHOUT_HELPER: ${{ inputs.diagnostic_without_helper }}
        run: bash scripts/package-widget-sharing-poc.sh

      - name: 上传候选 DMG 与静态核验结果
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 版本 7 系列
        with:
          name: ssl-widget-sharing-poc-${{ github.run_number }}
          path: |
            dist/widget-sharing-poc.dmg
            dist/widget-sharing-poc-verification.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
