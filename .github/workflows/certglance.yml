name: CertGlance 正式候选打包

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certglance-package
  cancel-in-progress: false

jobs:
  package:
    name: 检查、构建、签名与打包
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: 检出开源子仓
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 版本 7.0.1
        with:
          persist-credentials: false

      - name: 限定正式候选分支
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '只允许从 main 分支打包正式候选。' >&2
            exit 1
          fi

      - name: 静态与定点检查
        run: |
          bash -n scripts/check-certglance.sh scripts/package-certglance.sh
          bash scripts/check-certglance.sh

      - name: 使用项目专用证书打包
        env:
          SSL_WIDGET_SIGNING_P12_BASE64: ${{ secrets.SSL_WIDGET_SIGNING_P12_BASE64 }}
          SSL_WIDGET_SIGNING_P12_PASSWORD: ${{ secrets.SSL_WIDGET_SIGNING_P12_PASSWORD }}
          SSL_WIDGET_SIGNING_CERT_SHA1: ${{ vars.SSL_WIDGET_SIGNING_CERT_SHA1 }}
        run: bash scripts/package-certglance.sh

      - name: 上传候选 DMG 与静态核验结果
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 版本 7 系列
        with:
          name: certglance-${{ github.run_number }}
          path: |
            dist/CertGlance.dmg
            dist/certglance-verification.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
